name: vistra
include:
  - ../compose.postgres.yaml
  - ../compose.qdrant.yaml
services:
  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    image: vistra-api:local
    restart: unless-stopped
    init: true
    ports:
      - "${VISTRA_API_BIND:-127.0.0.1}:${VISTRA_API_PORT:-8067}:8000"
    environment:
      VISTRA_API_KEY: "${VISTRA_API_KEY:?Set VISTRA_API_KEY in .env}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}"
      JEV_API_KEY: "${JEV_API_KEY:-${TYPESAFE_API_KEY:-}}"
      OPEN_METEO_API_KEY: "${OPEN_METEO_API_KEY:-}"
      ORS_API_KEY: "${ORS_API_KEY:-}"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "${POSTGRES_DB:-vistra}"
      POSTGRES_USER: "${POSTGRES_USER:-vistra}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      QDRANT_URL: http://qdrant:6333
      VISTRA_API_CONCURRENCY: "${VISTRA_API_CONCURRENCY:-2}"
      OMP_NUM_THREADS: "${VISTRA_CPU_THREADS:-2}"
      MKL_NUM_THREADS: "${VISTRA_CPU_THREADS:-2}"
    volumes:
      - type: bind
        source: "${VISTRA_MODEL_CACHE:-../.cache/docker-models}"
        target: /app/.cache
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../datasets
        target: /app/datasets
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    mem_limit: 8g
    cpus: 4
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
    stop_grace_period: 2m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
