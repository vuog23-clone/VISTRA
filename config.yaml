# VISTRA configuration
# Settings used by the current retrieval and RAG pipeline.
# Relative paths resolve from the project root. Secrets and PostgreSQL credentials live in .env.

# --- Model runtime and embeddings ---
# Local models share the cache and device settings. Vector sizes must match existing Qdrant collections.
cache_folder: .cache
embedding_device: auto
models_local_files_only: true
sparse_models_local_files_only: false
text_embedding_model: voyageai/voyage-4-nano
text_vector_size: 2048
image_embedding_model: google/siglip2-base-patch16-224
image_vector_size: 768
image_normalize: true
sparse_embedding_model: Qdrant/bm25

# --- Qdrant connection ---
# A non-null URL uses the server; QDRANT_URL in the environment overrides it. Local paths are fallback storage.
qdrant_url: http://127.0.0.1:6333
qdrant_timeout_seconds: 30.0
qdrant_path: databases/vector_db/qdrant

# --- Google image dataset ---
# One Qdrant point per photo. PostgreSQL connection credentials belong in .env, not this file.
google_dataset_path: datasets/raw/google
google_images_collection: google_maps_images
qdrant_google_images_path: databases/vector_db/qdrant_google_maps_images
google_location_aliases:
  Hanoi: ["Ha Noi", "Hà Nội"]
  Ho Chi Minh City: ["Ho Chi Minh", "Hồ Chí Minh", "Saigon", "Sai Gon"]

# --- Wikivoyage dataset ---
# Raw inputs support preprocessing; processed files enrich text results and resolve page scope.
wikivoyage_collection: wikivoyage_voyage
wikivoyage_sparse_vector: bm25
wikivoyage_pages_dump: datasets/raw/wikivoyage/enwikivoyage-latest-page.sql
wikivoyage_geo_dump: datasets/raw/wikivoyage/enwikivoyage-latest-geo_tags.sql
wikivoyage_articles_dump: datasets/raw/wikivoyage/enwikivoyage-latest-pages-articles.xml
wikivoyage_pages_path: datasets/processed/wikivoyage/pages.jsonl
wikivoyage_geo_tags_path: datasets/processed/wikivoyage/geo_tags.jsonl
wikivoyage_articles_path: datasets/processed/wikivoyage/articles.jsonl
wikivoyage_chunks_path: datasets/processed/wikivoyage/chunks.jsonl

# --- Location scopes and reviewed mappings ---
# Null mapping paths disable optional reviewed associations. Google scopes use their own aliases above.
country_scopes_path: src/resolver/country_scopes.json
location_aliases:
  Hanoi: ["Hanoi, Vietnam"]
  Phu Quoc: ["Phu Quoc, Vietnam"]
location_mappings_path: null

# --- Preprocessing and indexing ---
# Chunk limits are in tokens; batch sizes control preparation/indexing work.
chunk_size: 450
chunk_overlap: 60
chunk_min_tokens: 40
text_embedding_batch_size: 32
sparse_embedding_batch_size: 256
wikivoyage_index_batch_size: 32
wikivoyage_sparse_index_batch_size: 256
metadata_index_batch_size: 500

# --- Retrieval and ranking ---
# Dense/BM25 fusion ranks text; hybrid searches both sources concurrently,
# then ranks image places by distance to the retrieved destination document.
# Maximum photo place cards; text searches use retrieval_limit.
search_limit: 20
# Total retained text chunks after dense/BM25 fusion, before page grouping.
retrieval_limit: 20
# Supporting photos per place; text defaults to its document budget per page.
retrieval_group_size: 3
candidate_min_limit: 20
candidate_multiplier: 4
# Null keeps relative visual matches without an uncalibrated cutoff.
image_search_score_threshold: null
rrf_k: 60
query_embedding_cache_size: 32
bm25_k: 1.2
bm25_b: 0.75
bm25_avg_len: 256.0
bm25_language: english

# --- Request routing ---
# Jev first decides retrieval vs direct LLM, then recognizes the destination
# and optionally selects the retrieval evidence route.
jev_api_url: https://api.typesafe.ai/v1/systemone
jev_model: jev-latest
jev_timeout_seconds: 15.0
jev_routing_enabled: true
jev_response_routing_enabled: true

# --- LLM generation and context ---
# OPENAI_API_KEY and JEV_API_KEY belong in .env. Source-grounding instructions are defined in src/prompts/.
openai_model: gpt-6-luna
openai_reasoning_effort: low
generation_timeout_seconds: 45.0
generation_max_tokens: 4000
generation_context_results: 5
generation_context_hits: 3
generation_excerpt_chars: 1800
# Attach sanitized retrieved photos to both generation and grounding review.
generation_vision_enabled: true
generation_max_images: 4
generation_image_timeout_seconds: 8.0

# --- Multi-turn chat memory (enabled by --user-id plus --session-id) ---
# PostgreSQL stores sessions/messages separately from durable user preferences/trips.
memory_recent_messages: 8
memory_message_chars: 2000
memory_context_chars: 24000
memory_preference_limit: 12
memory_trip_limit: 3

# --- Weather evidence for itineraries and weather questions ---
# Open-Meteo demo endpoint; OPEN_METEO_API_KEY selects its commercial endpoint.
weather_enabled: true
weather_timeout_seconds: 8.0

# --- Road/walking route estimates (optional ORS_API_KEY in .env) ---
# No live traffic, transit schedules, fares or booking availability. Default walking.
# Bound matrix candidates per city to control latency, quota and planner context.
ors_enabled: true
ors_timeout_seconds: 8.0
ors_max_locations: 12

# --- TravelPlanner-style tool collection, notebook and structured itineraries ---
planning_enabled: true
planning_max_steps: 20
planning_max_repairs: 1
# vistra uses current indexed data; benchmark requires the separately installed CSVs.
planning_data_mode: vistra
planning_benchmark_path: benchmarks/travelplanner/database
